<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ThinkFirst">
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#e4eeff"/>
  <g stroke="#23302a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- thought bubble -->
    <circle cx="47.5" cy="25.4" r="1.2" fill="#fff" stroke-width="1.4"/>
    <circle cx="49" cy="19.6" r="2" fill="#fff" stroke-width="1.4"/>
    <circle cx="51.5" cy="9.5" r="5.6" fill="#fff" stroke-width="1.4"/>
    <!-- head -->
    <circle cx="28" cy="40" r="17" fill="#ffd7b0"/>
    <path d="M11.5 38c-1.5-11 6-18 16.5-18 10 0 17 7 16.5 18-5-2-9-5-11-9-4 5-12 8-22 9z" fill="#5a3a28"/>
    <path d="M27 20.5c-1-3.5 1.5-5.5 4.5-5" fill="none"/>
    <!-- eyes looking up at the bubble -->
    <circle cx="21.5" cy="39" r="3.4" fill="#fff" stroke-width="1.5"/>
    <circle cx="34.5" cy="39" r="3.4" fill="#fff" stroke-width="1.5"/>
    <circle cx="22.7" cy="37.6" r="1.7" fill="#23302a" stroke="none"/>
    <circle cx="35.7" cy="37.6" r="1.7" fill="#23302a" stroke="none"/>
    <!-- curious brows -->
    <path d="M17.5 33q4-3 8-1.2M31 31.5q4-3.5 8-1.5" fill="none" stroke-width="1.7"/>
    <!-- cheeks and a small "hmm" mouth -->
    <circle cx="16.5" cy="45.5" r="2" fill="#ff8a7a" stroke="none" opacity=".7"/>
    <circle cx="39.5" cy="45.5" r="2" fill="#ff8a7a" stroke="none" opacity=".7"/>
    <path d="M25.5 49.5q2.5 1.5 5 0" fill="none" stroke-width="1.7"/>
    <!-- hand resting on the cheek -->
    <path d="M38 47c0-4 3-6.5 6.5-6 3.5.5 5 3.5 4 7-1 3.5-4 5.5-7.5 4.5-2-.6-3-2.7-3-5.5z" fill="#ffd7b0"/>
    <path d="M42 43.5v3M45.5 43v3" fill="none" stroke-width="1.4"/>
  </g>
</svg>
